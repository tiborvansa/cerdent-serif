<div class="call">
  <div class="call-box-top">
    {% if site.data.contact.phone %}
        <div class="call-phone"><strong>Tel: </strong> {{ site.data.contact.phone }} </div>
    {% endif %}
    {% if site.data.contact.email %}
    <div class="call-email"><strong>Email: </strong>
      <a href="mailto:{{ .site.data.contact.email }}">
        {{ site.data.contact.email }}
      </a>
    </div>
    {% endif %}
    <div class="call-phone">
      <br>
      <strong>Jsme tu pro Vás: </strong><br>
      Po-Čt: 7:00- 16:00 <br>
      Pá: 7:00- 13:00 <br>
    </div>  
  </div>
    {% if include.show_button %}
      <div class="call-box-bottom">
        <a href="{{ site.data.contact.contact_button_link }}" class="button">Objednat se</a>
      </div>
    {% endif %}
</div>
