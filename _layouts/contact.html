---
title: Contact
layout: default
bodyClass: "page-contact"
---

<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
    <div class="row justify-content-start">
        <div class="col-12 col-md-8">
            <div class="service service-single">
                <h1 class="title">{{page.title}}</h1>
                {% if site.xdent_online %}
                    {% include xdent.html %}
                {% endif %}        
                {% if site.data.contact.phone %}
                    <div class="call-phone">
                        <i class="fas fa-phone-alt"></i>
                        <a href="tel:{{ site.data.contact.phone | remove: ' ' }}" class="phone-number">
                        {{ site.data.contact.phone }}
                        </a>
                    </div>
                {% endif %}
                <div class="call-email"><strong>Email: </strong>
                    <a href="mailto:{{ site.data.contact.email }}">
                      {{ site.data.contact.email }}
                    </a>
                </div>
                <div class="content mt-4">{{content}}</div>
                <iframe style="border:none" src="https://mapy.com/s/nejagavema" width="400" height="280" frameborder="0"></iframe>
            </div>
        </div>
    </div>
</div>
